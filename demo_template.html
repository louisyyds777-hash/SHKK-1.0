<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>手绘K线 · 视觉演示（模拟数据）</title>
<style>
  :root{
    --paper:#f9f4e7; --ink:#4a4238; --bull:#c23a2f; --bear:#1f7d4d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:26px 18px;
    background:#e7e1cf;
    font-family:'KaiTi','楷体','STKaiti',serif;
    color:var(--ink);
  }
  .wrap{max-width:1720px; margin:0 auto;}
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px;
    background:var(--paper); border:2px solid #d8cfb6; border-radius:10px;

  }
  .toolbar h1{font-size:20px; margin:0 10px 0 0; font-weight:bold; letter-spacing:1px;}
  .toolbar h1 small{font-size:13px; color:#8b7f6a; font-weight:normal; margin-left:8px;}
  .searchbox{position:relative;}
  .searchbox input{
    font-family:inherit; font-size:15px; color:var(--ink);
    background:#fffee9; border:2px solid #c9bc98; border-radius:8px;
    padding:5px 12px; width:270px; outline:none;
  }
  .searchbox input:focus{border-color:#b08948;}
  #searchDrop{
    position:absolute; top:calc(100% + 4px); left:0; width:300px;
    background:#fffdf4; border:2px solid #c9bc98; border-radius:8px;
    box-shadow:2px 3px 0 rgba(90,78,60,.2); display:none; z-index:50;
    max-height:290px; overflow-y:auto;
  }
  #searchDrop .sd-item{padding:7px 12px; cursor:pointer; font-size:14.5px;}
  #searchDrop .sd-item:hover{background:#f3ecd8;}
  #searchDrop .sd-item b{margin-right:8px;}
  #searchDrop .sd-none{padding:8px 12px; color:#8b7f6a; font-size:13.5px;}
  .seg{display:flex; gap:0;}
  .seg button{
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#f3ecd8; border:2px solid #c9bc98; border-right-width:0;
    padding:4px 13px; cursor:pointer;
  }
  .seg button:first-child{border-radius:8px 0 0 8px;}
  .seg button:last-child{border-right-width:2px; border-radius:0 8px 8px 0;}
  .seg button.on{background:#e8d9ac; font-weight:bold;}
  .seg-label{font-size:14px; color:#8b7f6a;}
  .ctrl{display:flex; align-items:center; gap:6px; font-size:15px; cursor:pointer; user-select:none;}
  .ctrl input{width:16px; height:16px; accent-color:#b08948; cursor:pointer;}
  select{
    font-family:inherit; font-size:14.5px; color:var(--ink);
    background:#f3ecd8; border:2px solid #c9bc98; border-radius:8px;
    padding:3px 6px; cursor:pointer;
  }
  .spacer{flex:1;}
  button{
    font-family:inherit; font-size:15px; color:var(--ink);
    background:#f3ecd8; border:2px solid #c9bc98; border-radius:8px;
    padding:5px 16px; cursor:pointer; box-shadow:1px 2px 0 rgba(90,78,60,.2);
  }
  button:hover{background:#efe5c9;}
  button:active{transform:translate(1px,1px); box-shadow:none;}
  .main{display:flex; gap:14px; align-items:stretch;}
  .watchlist{
    width:196px; flex:none; background:var(--paper);
    border:2px solid #d8cfb6; border-radius:10px;

    padding:10px 0 6px; display:flex; flex-direction:column;

  .wl-head{
    font-size:16px; font-weight:bold; text-align:center; letter-spacing:2px;

  }
  #wlItems{flex:1; overflow-y:auto; padding:6px 6px 2px;}

  .wl-item.on{background:#e8d9ac; font-weight:bold;}

<script>
'use strict';
/* ================= 常量与工具 ================= */
const W = 1440, H = 800;
const M = { l: 68, r: 28, t: 54, b: 40 };
const PRICE_RATIO = 0.70, GAP = 22;
const DEFAULT_BARS = 40;
const C = {
  paper:'#f9f4e7', ink:'#4a4238', inkFaint:'rgba(74,66,56,.75)',
  grid:'rgba(122,106,82,.20)', gridBold:'rgba(122,106,82,.34)',
  bull:'#c23a2f', bear:'#1f7d4d',
  alt:'rgba(93,82,66,.55)', band:'rgba(233,196,96,.30)'
};
const FONT = "'KaiTi','楷体','STKaiti',serif";

/* 周期全集：5分 / 30分 / 60分(=1小时) / 日线 / 周线 / 月线 */
const PERIODS = {
  '5m' : { label:'5分钟',   full:'5分钟',     kind:'min',   minutes:5,  perDay:48, sigma:0.0035, gap:0.0005, days:10 },
  '30m': { label:'30分钟',  full:'30分钟',    kind:'min',   minutes:30, perDay:8,  sigma:0.0085, gap:0.0013, days:30 },
  '60m': { label:'60分钟',  full:'60分钟（1小时）', kind:'min', minutes:60, perDay:4, sigma:0.012, gap:0.0018, days:45 },
  '1d' : { label:'日线',    full:'日线',      kind:'day',   sigma:0.024, gap:0.008, days:120 },
  '1w' : { label:'周线',    full:'周线',      kind:'week',  sigma:0.055, gap:0.015, weeks:260 },
  '1M' : { label:'月线',    full:'月线',      kind:'month', sigma:0.11,  gap:0.03,  months:120 }
};

/* ================= 画风 ================= */
const STYLES = {
  pencil:{ name:'铅笔手绘', bg:'#f9f4e7',
           line:{mode:'rough', sw:2.2, rough:1.15, bowing:1.0},
           marker:'circle', vol:'hachure' },
  marker:{ name:'记号笔',   bg:'#fdfcf6',
           line:{mode:'rough', sw:3.2, rough:0.45, bowing:0.6},
           marker:'solid',  vol:'solid' },
  neon:  { name:'荧光笔',   bg:'#ffffff', bull:'#ff4d3d', bear:'#00a860',
           line:{mode:'plain', sw:8, alpha:0.42},
           marker:'ring',    vol:'block' },
  grid:  { name:'方格纸',   bg:'#fbfcf7',
           line:{mode:'plain', sw:1.8},
           marker:'dot',     vol:'outline' },
  brush: { name:'毛笔',     bg:'#faf7ee',
           line:{mode:'brush', sw:4.5},
           marker:'inkdot',  vol:'brushshade' }
};

/* ================= 模拟股票库 ================= */
const STOCKS = [
  ['600519','贵州茅台',1500],['000001','平安银行',11.5],['000858','五粮液',132],
  ['601318','中国平安',48],  ['300750','宁德时代',212],['002594','比亚迪',96],
  ['600036','招商银行',38],  ['000651','格力电器',46], ['601899','紫金矿业',17.5],
  ['002463','沪电股份',36]
];
function stockInfo(code){
  const s=STOCKS.find(x=>x[0]===String(code));
  if(s) return {code:s[0], name:s[1], base:s[2]};
  return {code:String(code), name:'演示股份 '+code, base:20};
}
function codeHash(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return Math.abs(h); }

let curStock = stockInfo('600519');
let watchlist = ['600519','000858','300750','601899'];
try{
  const saved=localStorage.getItem('hd_watchlist');
  if(saved && Array.isArray(JSON.parse(saved))) watchlist=JSON.parse(saved);
  const last=localStorage.getItem('hd_last');
  if(last) curStock=stockInfo(last);
}catch(e){}
function saveLocal(){
  try{
    localStorage.setItem('hd_watchlist',JSON.stringify(watchlist));
    localStorage.setItem('hd_last',curStock.code);
  }catch(e){}
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const fmt2 = x => x.toFixed(2);
const fmtVol = v => (v/10000).toFixed(1)+'万手';
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shortDate(d){return (d.getMonth()+1)+'/'+String(d.getDate()).padStart(2,'0');}
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function niceTicks(min,max,n){
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag; const step=(norm<1.5?1:norm<3.5?2:norm<7.5?5:10)*mag;
  const t0=Math.ceil(min/step)*step; const out=[];
  for(let v=t0;v<=max+1e-9;v+=step) out.push(+v.toFixed(4));
  return out;
}

/* ================= 模拟数据（按周期生成） ================= */
function makeBar(rnd,cfg,prev,dt,volMult,d1){
  const fat = rnd()<0.10 ? 2 : 1;               // 偶发大波动
  const o = +(prev*(1+(rnd()-0.5)*cfg.gap)).toFixed(3);
  const c = +(o*(1+(rnd()-0.5)*2*cfg.sigma*fat)).toFixed(3);
  const h = +(Math.max(o,c)*(1+rnd()*0.5*cfg.sigma*fat)).toFixed(3);
  const l = +(Math.min(o,c)*(1-rnd()*0.5*cfg.sigma*fat)).toFixed(3);
  const v = Math.round((2 + rnd()*3 + Math.abs(c-o)/o/cfg.sigma*2.5)*10000*volMult);
  return {dt, d1, o,h,l,c,v};
}
function genData(periodKey, seed, base){
  const cfg = PERIODS[periodKey];
  const rnd = mulberry32(seed), bars = [];
  let prev = base*(0.92+rnd()*0.16);
  if(cfg.kind==='min'){
    const volMult = 1/Math.sqrt(cfg.perDay);
    const sessions=[];
    for(let t=9*60+30+cfg.minutes; t<=11*60+30; t+=cfg.minutes) sessions.push(t);
    for(let t=13*60+cfg.minutes;  t<=15*60;    t+=cfg.minutes) sessions.push(t);
    let d=new Date(2025,5,2), made=0;
    while(made<cfg.days){
      if(d.getDay()!==0 && d.getDay()!==6){
        sessions.forEach((mins,k)=>{
          const b=makeBar(rnd,cfg,prev,new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(mins/60),mins%60),volMult,k===0);
          bars.push(b); prev=b.c;
        });
        made++;
      }
      d.setDate(d.getDate()+1);
    }
  }else if(cfg.kind==='day'){
    let d=new Date(2025,5,2), made=0;
    while(made<cfg.days){
      if(d.getDay()!==0 && d.getDay()!==6){
        const b=makeBar(rnd,cfg,prev,new Date(d),1,true);
        bars.push(b); prev=b.c; made++;
      }
      d.setDate(d.getDate()+1);
    }
  }else if(cfg.kind==='week'){
    let d=new Date(2020,5,1);
    for(let w=0;w<cfg.weeks;w++){
      const b=makeBar(rnd,cfg,prev,new Date(d),5,true);
      bars.push(b); prev=b.c;
      d.setDate(d.getDate()+7);
    }
  }else{
    let y=2015,m=0;
    for(let i=0;i<cfg.months;i++){
      const b=makeBar(rnd,cfg,prev,new Date(y,m,1),21,true);
      bars.push(b); prev=b.c;
      m++; if(m>11){m=0;y++;}
    }
  }
  return bars;
}

function heurPath(b){ return b.c>=b.o ? [b.o,b.l,b.h,b.c] : [b.o,b.h,b.l,b.c]; }
function heurAlt(b){ return b.c>=b.o ? [b.o,b.h,b.l,b.c] : [b.o,b.l,b.h,b.c]; }
function keyPoints(b){
  const tags = b.c>=b.o ? ['开','低','高','收'] : ['开','高','低','收'];
  return heurPath(b).map((p,i)=>({t:i/3,p,tag:tags[i]}));
}
function xLabel(b){
  if(curPeriod==='1M') return (b.dt.getFullYear()%100)+'/'+(b.dt.getMonth()+1);
  if(curPeriod==='1d'||curPeriod==='1w') return shortDate(b.dt);
  return b.d1 ? shortDate(b.dt)+' '+hhmm(b.dt) : hhmm(b.dt);
}

/* ================= 视图（缩放/平移） ================= */
let curPeriod = '1d', curStyle = 'pencil';
let bars = [];
const view = { x0:0, x1:1, pmin:0, pmax:1 };
const state = { candle:'none', showVol:true, showVals:false, showAlt:false };

const plotX=M.l, plotY=M.t, plotW=W-M.l-M.r;
const priceH=(H-M.t-M.b)*PRICE_RATIO;
const volTop=plotY+priceH+GAP, volH=H-M.b-volTop;
const spanX = () => view.x1-view.x0;
const slotW = () => plotW/spanX();
const trajW = () => Math.max(3, Math.min(slotW()*0.55, 90));
function slotCx(i){ return plotX + ((i+0.5)-view.x0)*slotW(); }
function xOf(i,t){ return slotCx(i)-trajW()/2+t*trajW(); }
function yOf(p){ return plotY+(view.pmax-p)/(view.pmax-view.pmin)*priceH; }
function volGeom(i,v,maxV){
  const w=trajW(), h=(v/maxV)*volH;
  return {x:slotCx(i)-w/2, y:volTop+volH-h, w, h};
}
function visRange(){
  return [Math.max(0,Math.floor(view.x0)-1), Math.min(bars.length,Math.ceil(view.x1)+1)];
}
function dataBounds(){
  let mn=Infinity,mx=-Infinity;
  bars.forEach(b=>{ if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h; });
  return {mn,mx};
}
function fitY(){
  const [i0,i1]=visRange();
  let mn=Infinity,mx=-Infinity;
  for(let i=i0;i<i1;i++){ const b=bars[i]; if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h; }
  if(!isFinite(mn)){ const d=dataBounds(); mn=d.mn; mx=d.mx; }
  view.pmin=mn*0.985; view.pmax=mx*1.015;
}
function resetView(){
  const N=bars.length;
  view.x0=Math.max(0,N-DEFAULT_BARS); view.x1=N;
  fitY();
}
function clampView(){
  const N=bars.length, db=dataBounds(), full=db.mx-db.mn;
  let sx=spanX();
  const cx=(view.x0+view.x1)/2;
  if(sx<3) sx=3; if(sx>N) sx=N;
  view.x0=cx-sx/2; view.x1=cx+sx/2;
  view.x0=Math.min(Math.max(view.x0,-sx*0.25), N-sx*0.75);
  view.x1=view.x0+sx;
  let sy=view.pmax-view.pmin;
  const cy=(view.pmin+view.pmax)/2;
  if(sy<full*0.02) sy=full*0.02; if(sy>full*3) sy=full*3;
  view.pmin=cy-sy/2; view.pmax=cy+sy/2;
  view.pmin=Math.min(Math.max(view.pmin, db.mn-full), db.mx);
  view.pmax=view.pmin+sy;
}

/* ================= 画布 ================= */
const canvas=document.getElementById('chart');
const dpr=Math.max(1,window.devicePixelRatio||1);
canvas.width=W*dpr; canvas.height=H*dpr;
const ctx=canvas.getContext('2d');
const base=document.createElement('canvas');
base.width=canvas.width; base.height=canvas.height;
const bctx=base.getContext('2d');
const rc=rough.canvas(base);

const bullColor = () => STYLES[curStyle].bull || C.bull;
const bearColor = () => STYLES[curStyle].bear || C.bear;

function drawBackground(g){
  const st=STYLES[curStyle];
  g.fillStyle=st.bg; g.fillRect(0,0,W,H);
  if(curStyle==='grid'){          /* 方格纸：整张纸都是方格背景（横竖格线都在纸面上） */
    g.strokeStyle='rgba(110,130,155,.16)'; g.lineWidth=1;
    for(let x=0.5;x<=W;x+=20){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
    for(let y=0.5;y<=H;y+=20){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  }
}
function drawTraj(g,i,b,color,tiny){
  const st=STYLES[curStyle];
  const pts=heurPath(b).map((p,k)=>[xOf(i,k/3),yOf(p)]);
  if(tiny){
    g.strokeStyle=color; g.lineWidth=1.2;
    g.beginPath(); pts.forEach((p,k)=>k===0?g.moveTo(p[0],p[1]):g.lineTo(p[0],p[1])); g.stroke();
    return;
  }
  if(st.line.mode==='rough'){
    rc.linearPath(pts,{stroke:color,strokeWidth:st.line.sw,roughness:st.line.rough,
      bowing:st.line.bowing||1,seed:1000+i*77});
  }else if(st.line.mode==='brush'){            /* 毛笔：宽淡一笔 + 细浓一笔，两层叠出笔锋 */
    const path=new Path2D();
    pts.forEach((p,k)=>k===0?path.moveTo(p[0],p[1]):path.lineTo(p[0],p[1]));
    g.save(); g.strokeStyle=color; g.lineJoin='round'; g.lineCap='round';
    g.globalAlpha=0.30; g.lineWidth=st.line.sw*2.4; g.stroke(path);
    g.globalAlpha=0.95; g.lineWidth=st.line.sw*0.55; g.stroke(path);
    g.restore();
  }else{
    g.save();
    g.globalAlpha=st.line.alpha||1;
    g.strokeStyle=color; g.lineWidth=st.line.sw; g.lineJoin='round'; g.lineCap='round';
    g.beginPath(); pts.forEach((p,k)=>k===0?g.moveTo(p[0],p[1]):g.lineTo(p[0],p[1])); g.stroke();
    g.restore();
  }
}
function drawMarker(g,i,x,y,color,k){
  const st=STYLES[curStyle];
  if(st.marker==='circle'){
    rc.circle(x,y,10,{stroke:color,fill:C.paper,fillStyle:'solid',
      strokeWidth:2,roughness:1.5,seed:31+i*13+k*7});
  }else if(st.marker==='solid'){
    rc.circle(x,y,11,{stroke:color,fill:color,fillStyle:'solid',
      strokeWidth:1.6,roughness:0.7,seed:31+i*13+k*7});
    g.fillStyle=C.paper; g.beginPath(); g.arc(x,y,2.2,0,7); g.fill();
  }else if(st.marker==='ring'){
    g.strokeStyle=color; g.lineWidth=3;
    g.beginPath(); g.arc(x,y,5.5,0,7); g.stroke();
  }else if(st.marker==='inkdot'){
    g.strokeStyle=color; g.lineWidth=1.5; g.globalAlpha=0.30;
    g.beginPath(); g.arc(x,y,6.5,0,7); g.stroke();
    g.globalAlpha=1; g.fillStyle=color;
    g.beginPath(); g.arc(x,y,3.5,0,7); g.fill();
  }else{
    g.fillStyle=color; g.beginPath(); g.arc(x,y,2.8,0,7); g.fill();
  }
}
function drawVol(g,i,b,color,maxV,tiny){
  const st=STYLES[curStyle];
  const vg=volGeom(i,b.v,maxV);
  if(vg.h<=0.5) return;
  if(tiny){
    g.save(); g.globalAlpha=0.55; g.fillStyle=color;
    g.fillRect(vg.x,vg.y,Math.max(1,vg.w),vg.h); g.restore();
    return;
  }
  if(st.vol==='hachure'){
    rc.rectangle(vg.x,vg.y,vg.w,vg.h,{
      stroke:color, strokeWidth:1.4, roughness:0.9, seed:500+i*37,
      fill:color, fillStyle:'hachure', hachureGap:4.5, hachureAngle:-41,
      fillWeight:1
    });
  }else if(st.vol==='brushshade'){             /* 毛笔：重笔排线 */
    rc.rectangle(vg.x,vg.y,vg.w,vg.h,{
      stroke:color, strokeWidth:1.8, roughness:1.1, seed:500+i*37,
      fill:color, fillStyle:'hachure', hachureGap:7, hachureAngle:-41,
      fillWeight:2.2
    });
  }else if(st.vol==='solid'){
    g.save(); g.globalAlpha=0.5; g.fillStyle=color;
    g.fillRect(vg.x,vg.y,vg.w,vg.h);
    g.globalAlpha=1; g.strokeStyle=color; g.lineWidth=1.2;
    g.strokeRect(vg.x+.5,vg.y+.5,vg.w,vg.h); g.restore();
  }else if(st.vol==='block'){
    g.save(); g.globalAlpha=0.32; g.fillStyle=color;
    g.fillRect(vg.x,vg.y,vg.w,vg.h); g.restore();
  }else{
    g.save(); g.globalAlpha=0.10; g.fillStyle=color;
    g.fillRect(vg.x,vg.y,vg.w,vg.h);
    g.globalAlpha=1; g.strokeStyle=color; g.lineWidth=1.1;
    g.strokeRect(vg.x+.5,vg.y+.5,vg.w,vg.h); g.restore();
  }
}

function drawAll(g){
  g.setTransform(dpr,0,0,dpr,0,0);
  drawBackground(g);
  /* 标题与提示 */
  const cfg=PERIODS[curPeriod];
  g.font="16px "+FONT; g.fillStyle=C.ink; g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText(curStock.name+' '+curStock.code+' · '+cfg.full+' · '+fmtDate(bars[0].dt)+' ~ '+fmtDate(bars[bars.length-1].dt)+' · 模拟数据 · '+STYLES[curStyle].name, plotX, 32);
  g.font="13.5px "+FONT; g.fillStyle=C.inkFaint; g.textAlign='right';
  g.fillText('○ 拐点=开/高/低/收 · 滚轮缩放 · 拖动平移 · 双击复位', W-M.r, 32);
  /* 价格网格与刻度（随视图实时变化） */
  const ticks=niceTicks(view.pmin,view.pmax,6);
  g.textAlign='right'; g.font="12.5px "+FONT;
  ticks.forEach(v=>{
    const y=yOf(v);
    if(y<plotY-2||y>plotY+priceH+2) return;
    g.strokeStyle=C.grid; g.lineWidth=1;
    g.beginPath(); g.moveTo(plotX,y); g.lineTo(W-M.r,y); g.stroke();
    g.fillStyle=C.inkFaint; g.fillText(fmt2(v), plotX-10, y+4);
  });
  /* X轴标签 */
  const [i0,i1]=visRange();
  const sw=slotW();
  const labelStep=Math.max(1, Math.round(58/sw));
  g.textAlign='center'; g.font="12.5px "+FONT;
  for(let i=i0;i<i1;i++){
    if(i%labelStep!==0 && i!==bars.length-1) continue;
    const b=bars[i];
    g.fillStyle=(b.d1 && PERIODS[curPeriod].kind==='min') ? C.ink : C.inkFaint;
    g.fillText(xLabel(b), slotCx(i), H-14);
  }
  /* 逐根绘制（裁剪在绘图区内） */
  let maxV=1;
  if(state.showVol){ for(let i=i0;i<i1;i++) if(bars[i].v>maxV) maxV=bars[i].v; maxV*=1.08; }
  g.save();
  g.beginPath(); g.rect(plotX,plotY,plotW,priceH+GAP+volH); g.clip();
  const tw=trajW();
  const tiny = sw<6;                     /* 缩得太远（每根K线不足6像素宽）时才用简笔模式 */
  for(let i=i0;i<i1;i++){
    const b=bars[i];
    const color=b.c>=b.o?bullColor():bearColor();
    /* 叠加蜡烛：full=完整蜡烛 / body=仅实体圆柱（无上下影线） */
    if(state.candle!=='none'){
      g.save();
      g.globalAlpha = state.candle==='body' ? 0.38 : 0.26;
      const bw=Math.max(4,tw*0.55), cx=slotCx(i);
      if(state.candle==='full'){
        g.strokeStyle=color; g.lineWidth=1.6;
        g.beginPath(); g.moveTo(cx,yOf(b.h)); g.lineTo(cx,yOf(b.l)); g.stroke();
      }
      const y1=yOf(Math.max(b.o,b.c)), y2=yOf(Math.min(b.o,b.c));
      g.fillStyle=color; g.fillRect(cx-bw/2, y1, bw, Math.max(1.5,y2-y1));
      g.restore();
    }
    /* 量能 */
    if(state.showVol) drawVol(g,i,b,color,maxV,tiny);
    /* 候选路径（虚线示意另一种可能的顺序） */
    if(state.showAlt && !tiny){
      g.save();
      g.strokeStyle=C.alt; g.lineWidth=1.4; g.setLineDash([6,5]);
      g.beginPath();
      heurAlt(b).forEach((p,k)=>{ const x=xOf(i,k/3), y=yOf(p); k===0?g.moveTo(x,y):g.lineTo(x,y); });
      g.stroke(); g.restore();
    }
    /* 主轨迹（开高低收4点） */
    drawTraj(g,i,b,color,tiny);
    /* 拐点标记 */
    if(!tiny){
      keyPoints(b).forEach((kp,k)=>drawMarker(g,i,xOf(i,kp.t),yOf(kp.p),color,k));
    }
    /* 拐点数值标签 */
    if(state.showVals && sw>26){
      g.font="11.5px "+FONT; g.fillStyle=C.ink;
      keyPoints(b).forEach(kp=>{
        const x=xOf(i,kp.t), y=yOf(kp.p), s=kp.tag+fmt2(kp.p);
        if(kp.tag==='开'){ g.textAlign='right'; g.fillText(s,x-9,y+4); }
        else if(kp.tag==='收'){ g.textAlign='left'; g.fillText(s,x+9,y+4); }
        else if(kp.tag==='高'){ g.textAlign='center'; g.fillText(s,x,y-10); }
        else{ g.textAlign='center'; g.fillText(s,x,y+18); }
      });
    }
  }
  g.restore();
  /* 量能区分隔线 */
  g.strokeStyle=C.gridBold; g.lineWidth=1;
  g.beginPath(); g.moveTo(plotX,volTop-GAP/2); g.lineTo(W-M.r,volTop-GAP/2); g.stroke();
  g.font="12px "+FONT; g.fillStyle=C.inkFaint; g.textAlign='right';
  g.fillText('量能', plotX-10, volTop+volH-4);
}

function renderBase(){ drawAll(bctx); blit(); }
function blit(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(base,0,0);
}

/* ================= 交互：缩放 / 平移 / 悬浮 ================= */
const tip=document.getElementById('tooltip');
let isDragging=false, dragStart=null;

function canvasXY(e){
  const r=canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}
function drawHover(i){
  blit();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=C.band;
  ctx.fillRect(plotX+(i-view.x0)*slotW(), plotY, slotW(), priceH+GAP+volH);
}
function tipHtml(b,i){
  const prevC=i>0?bars[i-1].c:b.o;
  const pct=((b.c/prevC-1)*100);
  const col=b.c>=b.o?'var(--bull)':'var(--bear)';
  const bull=b.c>=b.o;
  const stamp = PERIODS[curPeriod].kind==='min' ? fmtDate(b.dt)+' '+hhmm(b.dt) : fmtDate(b.dt);
  const traj = bull
    ? '开'+fmt2(b.o)+' → 探低'+fmt2(b.l)+' → 冲高'+fmt2(b.h)+' → 收'+fmt2(b.c)
    : '开'+fmt2(b.o)+' → 冲高'+fmt2(b.h)+' → 跌低'+fmt2(b.l)+' → 收'+fmt2(b.c);
  return '<div class="tip-date">'+curStock.name+' '+stamp+' · '+(bull?'多（收阳）':'空（收阴）')+'</div>'
    +'<div>开 '+fmt2(b.o)+'　高 '+fmt2(b.h)+'　低 '+fmt2(b.l)+'　收 <b style="color:'+col+'">'+fmt2(b.c)+'</b></div>'
    +'<div>涨跌幅 <b style="color:'+col+'">'+(pct>=0?'+':'')+pct.toFixed(2)+'%</b>　量能 '+fmtVol(b.v)+'</div>'
    +'<div>轨迹：'+traj+'</div>';
}
canvas.addEventListener('pointerdown',e=>{
  isDragging=true; dragStart={cx:e.clientX, cy:e.clientY, v:{...view}};
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  tip.style.display='none';
});
canvas.addEventListener('pointermove',e=>{
  if(isDragging){
    const r=canvas.getBoundingClientRect();
    const dx=(e.clientX-dragStart.cx)*W/r.width;
    const dy=(e.clientY-dragStart.cy)*H/r.height;
    const sx=dragStart.v.x1-dragStart.v.x0, sy=dragStart.v.pmax-dragStart.v.pmin;
    view.x0=dragStart.v.x0-dx/plotW*sx;
    view.x1=dragStart.v.x1-dx/plotW*sx;
    view.pmin=dragStart.v.pmin+dy/priceH*sy;
    view.pmax=dragStart.v.pmax+dy/priceH*sy;
    clampView(); renderBase();
    return;
  }
  const {x,y}=canvasXY(e);
  let i=Math.floor(view.x0+(x-plotX)/plotW*spanX());
  if(x<plotX||x>W-M.r||y<plotY||y>H-M.b||i<0||i>=bars.length) i=-1;
  if(i>=0){
    drawHover(i);
    tip.innerHTML=tipHtml(bars[i],i);
    tip.style.display='block';
    const tw2=tip.offsetWidth, th=tip.offsetHeight;
    let tx=e.clientX+18, ty=e.clientY+16;
    if(tx+tw2>innerWidth-8) tx=e.clientX-tw2-14;
    if(ty+th>innerHeight-8) ty=e.clientY-th-14;
    tip.style.left=tx+'px'; tip.style.top=ty+'px';
  }else{
    blit(); tip.style.display='none';
  }
});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>{
  isDragging=false; canvas.classList.remove('dragging');
}));
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const {x,y}=canvasXY(e);
  const f=e.deltaY>0?1.18:1/1.18;
  const bx=view.x0+(x-plotX)/plotW*spanX();
  const py=view.pmax-(y-plotY)/priceH*(view.pmax-view.pmin);
  view.x0=bx-(bx-view.x0)*f; view.x1=bx+(view.x1-bx)*f;
  view.pmin=py-(py-view.pmin)*f; view.pmax=py+(view.pmax-py)*f;
  clampView(); renderBase();
},{passive:false});
canvas.addEventListener('dblclick',()=>{ resetView(); renderBase(); });
canvas.addEventListener('mouseleave',()=>{ if(!isDragging){ blit(); tip.style.display='none'; } });

/* ================= 股票切换 / 搜索 / 自选库 ================= */
function applyData(){
  bars=genData(curPeriod, codeHash(curStock.code)+Object.keys(PERIODS).indexOf(curPeriod)*7, curStock.base);
  resetView(); renderBase();
}
function setStock(code){
  curStock=stockInfo(code);
  searchInput.value=curStock.code+' '+curStock.name;
  applyData(); renderWatchlist(); updateStatus(); saveLocal();
}
const searchInput=document.getElementById('searchInput');
const searchDrop=document.getElementById('searchDrop');
function searchMatches(q){
  q=q.trim(); if(!q) return [];
  return STOCKS.filter(s=>s[0].includes(q)||s[1].includes(q)).slice(0,8);
}
function renderDrop(list,q){
  searchDrop.innerHTML='';
  if(!q.trim()){ searchDrop.style.display='none'; return; }
  if(list.length===0 && !/^\d{6}$/.test(q.trim())){
    searchDrop.innerHTML='<div class="sd-none">演示库中无匹配（仅收录10只，正式版接入全市场A股）</div>';
    searchDrop.style.display='block'; return;
  }
  list.forEach(s=>{
    const d=document.createElement('div');
    d.className='sd-item';
    d.innerHTML='<b>'+s[0]+'</b>'+s[1];
    d.addEventListener('mousedown',ev=>{ ev.preventDefault(); setStock(s[0]); searchDrop.style.display='none'; });
    searchDrop.appendChild(d);
  });
  if(/^\d{6}$/.test(q.trim())){
    const d=document.createElement('div');
    d.className='sd-item';
    d.innerHTML='<b>'+q.trim()+'</b>模拟生成该代码演示数据';
    d.addEventListener('mousedown',ev=>{ ev.preventDefault(); setStock(q.trim()); searchDrop.style.display='none'; });
    searchDrop.appendChild(d);
  }
  searchDrop.style.display='block';
}
searchInput.addEventListener('input',()=>renderDrop(searchMatches(searchInput.value),searchInput.value));
searchInput.addEventListener('focus',()=>renderDrop(searchMatches(searchInput.value),searchInput.value));
searchInput.addEventListener('blur',()=>setTimeout(()=>searchDrop.style.display='none',150));
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const q=searchInput.value.trim();
    const m=searchMatches(q);
    if(m.length>0) setStock(m[0][0]);
    else if(/^\d{6}$/.test(q)) setStock(q);
    searchDrop.style.display='none';
  }
});
const wlItems=document.getElementById('wlItems');
const btnStar=document.getElementById('btnStar');
function renderWatchlist(){
  wlItems.innerHTML='';
  if(watchlist.length===0){
    wlItems.innerHTML='<div class="wl-empty">自选库为空<br>查股票后点「☆ 加自选」</div>';
  }
  watchlist.forEach(code=>{
    const info=stockInfo(code);
    const div=document.createElement('div');
    div.className='wl-item'+(code===curStock.code?' on':'');
    div.innerHTML='<span class="wl-code">'+info.code+'</span><span class="wl-name">'+info.name+'</span><span class="wl-rm">✕</span>';
    div.addEventListener('click',e=>{
      if(e.target.classList.contains('wl-rm')){
        watchlist=watchlist.filter(c=>c!==code);
        saveLocal(); renderWatchlist();
      }else setStock(code);
    });
    wlItems.appendChild(div);
  });
  btnStar.textContent = watchlist.includes(curStock.code) ? '★ 已在自选' : '☆ 加自选';
}
btnStar.addEventListener('click',()=>{
  if(watchlist.includes(curStock.code))
    watchlist=watchlist.filter(c=>c!==curStock.code);
  else watchlist.push(curStock.code);
  saveLocal(); renderWatchlist();
});

/* ================= 控件 ================= */
function bindCk(id,key){
  const el=document.getElementById(id);
  el.addEventListener('change',()=>{ state[key]=el.checked; renderBase(); });
}
bindCk('ckVol','showVol'); bindCk('ckVals','showVals'); bindCk('ckAlt','showAlt');
const selCandle=document.getElementById('selCandle');
selCandle.addEventListener('change',()=>{ state.candle=selCandle.value; renderBase(); });

const seg=document.getElementById('periodSeg');
Object.keys(PERIODS).forEach(k=>{
  const b=document.createElement('button');
  b.textContent=PERIODS[k].label; b.dataset.k=k;
  b.addEventListener('click',()=>setPeriod(k));
  seg.appendChild(b);
});
function setPeriod(k){
  curPeriod=k;
  seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  applyData(); updateStatus();
}
const styleSeg=document.getElementById('styleSeg');
Object.keys(STYLES).forEach(k=>{
  const b=document.createElement('button');
  b.textContent=STYLES[k].name; b.dataset.k=k;
  b.addEventListener('click',()=>setStyle(k));
  styleSeg.appendChild(b);
});
function setStyle(k){
  curStyle=k;
  styleSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  renderBase(); updateStatus();
}
document.getElementById('btnReset').addEventListener('click',()=>{ resetView(); renderBase(); });
document.getElementById('btnExport').addEventListener('click',()=>{
  blit();
  const a=document.createElement('a');
  a.download='手绘K线-'+curStock.name+'-'+PERIODS[curPeriod].label+'-'+STYLES[curStyle].name+'.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
});
document.getElementById('btnRegen').addEventListener('click',()=>{
  bars=genData(curPeriod,(Date.now()%1e9)|0,curStock.base);
  resetView(); renderBase(); updateStatus();
});
function updateStatus(){
  document.getElementById('statusbar').textContent=
    curStock.name+'（'+curStock.code+'）· 自选 '+watchlist.length+' 只 · 周期：'+PERIODS[curPeriod].full+' · 画风：'+STYLES[curStyle].name+' · 共 '+bars.length+' 根 · 滚轮缩放 · 按住拖动 · 双击复位 · 模拟数据，仅供视觉确认';
}

/* ================= 启动（支持 ?p=60m&c=body&s=neon 这类参数便于测试） ================= */
const qp=new URLSearchParams(location.search);
setPeriod(PERIODS[qp.get('p')]?qp.get('p'):'1d');
const qc=qp.get('c');
if(qc && ['none','full','body'].includes(qc)){ selCandle.value=qc; state.candle=qc; }
setStyle(STYLES[qp.get('s')]?qp.get('s'):'pencil');
searchInput.value=curStock.code+' '+curStock.name;
renderWatchlist(); updateStatus(); renderBase();
</script>
